name: Проверка ядра TypeScript
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  тесты:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить тесты
        run: npm test
      - name: Проверить запуск
        run: npm start
