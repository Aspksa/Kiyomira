name: Проверка ядра TypeScript
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
jobs:
  тесты:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Проверить TypeScript
        run: npm test
      - name: Проверить одиночный запуск
        run: npm start
      - name: Проверить переносимый запуск Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = (Get-Location).Path
          $folder = Join-Path $env:RUNNER_TEMP 'Рабочий стол & (тест) ! ^ % ;'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          foreach ($name in 'Kiyomira.bat', 'Kiyomira.ps1', 'Kiyomira.cjs', 'package.json') {
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination $folder
          }
          foreach ($name in '08-Запуск', '01-Ядро', '02-Память', '03-Задачи', '04-Модели') {
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination $folder -Recurse
          }
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $folder 'Kiyomira.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $nodeDir = Join-Path $folder '09-Окружение/Нода'
          New-Item -ItemType Directory -Path $nodeDir -Force | Out-Null
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination (Join-Path $nodeDir 'node.exe')
          Push-Location $folder
          try {
            '/exit' | & '.\Kiyomira.bat'
            if ($LASTEXITCODE -ne 0) { throw "BAT завершился с кодом $LASTEXITCODE" }
            if (-not (Test-Path -LiteralPath '.\06-Данные\память.sqlite')) { throw 'SQLite не создана' }
            if (Test-Path -LiteralPath '.\06-Данные\запуск.lock') { throw 'Осталась блокировка запуска' }
          } finally { Pop-Location }
